name: Build

on:
  push:
    tags:
      - '*'

concurrency:
  group: antizapret

env:
  DOCKER_BUILD_CHECKS_ANNOTATIONS: false
  DOCKER_BUILD_SUMMARY: false
  DOCKER_BUILD_RECORD_UPLOAD: false
  REPOSITORY_PREFIX: flameshikari/antizapret-vpn

jobs:
  build:
    name: ${{ matrix.service }} [${{ matrix.arch }}]
    runs-on: ${{ contains(matrix.arch, 'arm') && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        arch:
          - amd64
          - arm64
        service:
          # - adguard
          # - antizapret
          # - cloak
          # - coredns
          - dashboard
          # - filebrowser
          # - firewall
          # - https
          - openvpn
          # - openvpn-ui
          # - wireguard
          # - wireguard-amnezia
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ github.actor }}
          password: ${{ secrets.DOCKER_PAT }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set Metadata
        uses: docker/metadata-action@v5
        id: metadata
        with:
          images: |
            ${{ env.REPOSITORY_PREFIX }}-${{ matrix.service }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Build Image
        uses: docker/bake-action@v6
        id: build
        with:
          platforms: linux/${{ matrix.arch }}
          target: ${{ matrix.service }}
          tags: ${{ env.REPOSITORY_PREFIX }}-${{ matrix.service }}
          context: ./services/${{ matrix.service }}
          labels: ${{ steps.metadata.outputs.labels }}
          outputs: type=image,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=build-${{ matrix.service }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=build-${{ matrix.service }}-${{ matrix.arch }}

          name: Build and push
          uses: docker/bake-action@v6
          with:
            source: .
            push: true
            set: |
              *.tags=user/app:latest


      - name: Export Digest
        run: |
          mkdir -p "${{ runner.temp }}/digests/${{ matrix.service }}/${{ matrix.arch }}"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${{ matrix.service }}/${{ matrix.arch }}/${digest#sha256:}"

      - name: Upload Digest
        uses: actions/upload-artifact@v6
        with:
          name: digest-${{ matrix.service }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/${{ matrix.service }}
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Merge
    runs-on: ubuntu-24.04
    needs: build
    permissions:
      contents: read
      packages: write
    steps:

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ github.actor }}
          password: ${{ secrets.DOCKER_PAT }}

      - name: Download Digests
        uses: actions/download-artifact@v7
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-*
          merge-multiple: true

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create Manifests
        working-directory: ${{ runner.temp }}/digests
        run: |
          set -euo pipefail
          for service in $(ls .); do
            digest_amd64=$(ls ${service}/amd64)
            digest_arm64=$(ls ${service}/arm64)
            tag="${{ env.REPOSITORY_PREFIX }}-$service"
            docker buildx imagetools create \
            --tag ${tag}:latest \
            --tag ${tag}:${{ github.ref_name }} \
            ${tag}@sha256:${digest_amd64} \
            ${tag}@sha256:${digest_arm64}
          done